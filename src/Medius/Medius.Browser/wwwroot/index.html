<!DOCTYPE html>
<html lang="en">
<head>
    <title>Medius</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08111f">
    <base href="./">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./app.css">
    <link rel="stylesheet" href="./medius.css">
</head>
<body>
    <main id="workspace">
        <section id="out">
            <div class="loading-splash">Loading Medius…</div>
        </section>
        <section id="player-shell" class="collapsed">
            <button id="player-preview-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="player-stage">
                <span>Video preview</span>
                <span class="player-preview-meta">
                    <span id="player-preview-activity">Idle</span>
                    <span id="player-preview-toggle-icon">▲</span>
                </span>
            </button>
            <div id="player-stage">
                <video id="media-player" controls playsinline></video>
                <div id="player-loading" hidden>
                    <div class="loading-spinner"></div>
                    <div id="player-loading-text">Loading media…</div>
                </div>
            </div>
            <div id="player-status-row">
                <span id="player-activity" data-stage="idle">Idle</span>
                <div id="player-status">Select a video from the browser.</div>
            </div>
        </section>
    </main>
    <div id="sync-qr-overlay" hidden>
        <div id="sync-qr-card">
            <button id="sync-qr-close" type="button" onclick="document.getElementById('sync-qr-overlay').hidden=true">✕</button>
            <h2 id="sync-qr-title">Medius sync</h2>
            <img id="sync-qr-image" alt="Medius sync QR code">
            <video id="sync-qr-camera" muted autoplay playsinline hidden></video>
            <p id="sync-qr-message"></p>
        </div>
    </div>
    <script>
        window.__mediusErrors = [];
        window.addEventListener("error", event => window.__mediusErrors.push(event.error?.stack ?? event.message));
        window.addEventListener("unhandledrejection", event => window.__mediusErrors.push(event.reason?.stack ?? String(event.reason)));
        window.setPlayerPreviewExpanded = expanded => {
            const shell = document.getElementById("player-shell");
            const toggle = document.getElementById("player-preview-toggle");
            shell.classList.toggle("collapsed", !expanded);
            toggle.setAttribute("aria-expanded", String(expanded));
            document.getElementById("player-preview-toggle-icon").textContent = expanded ? "▼" : "▲";
        };
        document.getElementById("player-preview-toggle").addEventListener("click", () => {
            const shell = document.getElementById("player-shell");
            window.setPlayerPreviewExpanded(shell.classList.contains("collapsed"));
        });
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js")
                .catch(error => window.__mediusErrors.push(error?.stack ?? String(error)));
        }
    </script>
    <script src="_framework/blazor.webassembly.js" autostart="true"></script>
</body>
</html>

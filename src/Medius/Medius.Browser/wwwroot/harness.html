<!DOCTYPE html>
<html lang="en">
<head>
    <title>Medius player harness</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: system-ui, sans-serif; margin: 16px; background: #10141f; color: #e6e9f0; }
        #media-player { width: 720px; max-width: 100%; background: #000; }
        button { margin: 0 8px 8px 0; padding: 6px 12px; }
        pre { background: #000; padding: 10px; white-space: pre-wrap; max-height: 160px; overflow: auto; }
        #player-status { font-weight: 600; }
    </style>
</head>
<body>
    <h1>Player harness</h1>
    <p>Exercises player.js directly against local files, without the Avalonia app or cloud storage.</p>
    <div>
        <button data-file="medius-wus-test.avi">Short AVI</button>
        <button data-file="medius-wus-test.mkv">Short MKV</button>
        <button data-file="medius-wus-full.avi">Full AVI</button>
        <button data-file="medius-wus-full.mkv">Full MKV</button>
    </div>
    <div>
        <button data-seek="60">Seek 1:00</button>
        <button data-seek="300">Seek 5:00</button>
        <button data-seek="600">Seek 10:00</button>
        <button data-seek="0">Seek start</button>
    </div>
    <p id="player-status">Idle.</p>
    <video id="media-player" controls playsinline></video>
    <pre id="harness-log"></pre>
    <script type="module">
        import { playVideo } from "./player.js";

        const log = message => {
            const element = document.getElementById("harness-log");
            element.textContent += `${message}\n`;
            element.scrollTop = element.scrollHeight;
        };

        window.__harness = { startedSeconds: null, failure: null, file: null };

        async function run(file) {
            window.__harness = { startedSeconds: null, failure: null, file };
            document.getElementById("harness-log").textContent = "";
            const startedAt = performance.now();
            try {
                await playVideo(`./testmedia/${file}`, file, "Transcode", null, 0);
                window.__harness.startedSeconds = (performance.now() - startedAt) / 1000;
                log(`playback started after ${window.__harness.startedSeconds.toFixed(1)}s`);
            } catch (error) {
                window.__harness.failure = error?.message ?? String(error);
                log(`FAILED: ${window.__harness.failure}`);
            }
        }

        for (const button of document.querySelectorAll("button[data-file]")) {
            button.onclick = () => run(button.dataset.file);
        }

        for (const button of document.querySelectorAll("button[data-seek]")) {
            button.onclick = () => {
                const seconds = Number(button.dataset.seek);
                document.getElementById("media-player").currentTime = seconds;
                log(`seeking to ${seconds}s`);
            };
        }

        window.__runHarness = run;
        window.__seekHarness = seconds => {
            document.getElementById("media-player").currentTime = seconds;
            log(`seeking to ${seconds}s`);
        };
    </script>
</body>
</html>

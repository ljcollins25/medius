<!DOCTYPE html>
<html lang="en">
<head>
    <title>Medius player harness</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: system-ui, sans-serif; margin: 16px; background: #10141f; color: #e6e9f0; }
        #media-player { width: 640px; max-width: 100%; background: #000; }
        button { margin-right: 8px; padding: 6px 12px; }
        pre { background: #000; padding: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Player harness</h1>
    <p>Exercises player.js directly against local files, without the Avalonia app or cloud storage.</p>
    <div>
        <button id="play-avi">Play AVI</button>
        <button id="play-mkv">Play MKV</button>
    </div>
    <p id="player-status">Idle.</p>
    <video id="media-player" controls playsinline></video>
    <pre id="harness-log"></pre>
    <script type="module">
        import { playVideo } from "./player.js";

        const log = message => {
            document.getElementById("harness-log").textContent += `${message}\n`;
        };
        window.__harness = { started: null, failure: null };

        async function run(file) {
            window.__harness = { started: null, failure: null };
            document.getElementById("harness-log").textContent = "";
            const startedAt = performance.now();
            try {
                await playVideo(`./testmedia/${file}`, file, "Transcode", null, 0);
                window.__harness.started = (performance.now() - startedAt) / 1000;
                log(`playVideo resolved after ${window.__harness.started.toFixed(1)}s`);
            } catch (error) {
                window.__harness.failure = error?.message ?? String(error);
                log(`FAILED: ${window.__harness.failure}`);
            }
        }

        document.getElementById("play-avi").onclick = () => run("medius-wus-test.avi");
        document.getElementById("play-mkv").onclick = () => run("medius-wus-test.mkv");
        window.__runHarness = run;
    </script>
</body>
</html>
